name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mt5-bot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mt5-bot-apk
          path: mt5-bot.apk

      - name: Publish release (download langsung dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: mt5-bot build ${{ github.run_number }}
          body: Unduh mt5-bot.apk di bawah lalu install di Android.
          files: mt5-bot.apk
          make_latest: true
